neo_seo.draft_render:
  path: '/neo-seo/draft/{entity_type_id}/{entity}'
  defaults:
    _controller: '\Drupal\neo_seo\Controller\DraftRenderController::render'
  methods: [GET]
  options:
    parameters:
      entity:
        type: 'entity:{entity_type_id}'
    no_cache: TRUE
  requirements:
    _entity_access: 'entity.update'

neo_seo.tokens:
  path: '/neo-seo/tokens'
  defaults:
    _controller: '\Drupal\neo_seo\Controller\TokensController::lookup'
  methods: [GET]
  options:
    no_cache: TRUE
  requirements:
    _permission: 'edit neo_seo overrides+administer neo_seo'

neo_seo.schemamap:
  path: '/schemamap.xml'
  defaults:
    _controller: '\Drupal\neo_seo\Controller\SchemamapController::index'
  methods: [GET]
  requirements:
    _access: 'TRUE'

neo_seo.schemamap_feed:
  path: '/neo-seo/schema/{entity_type}/{bundle}/{page}'
  defaults:
    _controller: '\Drupal\neo_seo\Controller\SchemamapController::feed'
    page: 1
  methods: [GET]
  requirements:
    _access: 'TRUE'
    entity_type: '[a-z0-9_]+'
    bundle: '[a-z0-9_]+'
    page: '\d+'
