# The media picker (neo_seo_media): its preview, Remove, and the command the
# media library answers with.
media_picker:
  version: VERSION
  neo: { scope: back }
  css:
    component:
      src/css/media-picker.css: {}
  js:
    src/js/media-picker.ts: {}
  dependencies:
    - core/drupal
    - core/drupal.ajax
    - core/once

# The snippet input: a title or description with tokens as named pills, and a
# picker of the snippet variables and every token (Drupal\neo_seo\Snippet).
snippet:
  version: VERSION
  neo: { scope: back }
  css:
    component:
      src/css/snippet.css: {}
  js:
    src/js/snippet.ts: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/once

# The page URL under the slug and custom URL controls (PageUrl): the address
# the page will have once saved, and what an editor should know about it.
page_url:
  version: VERSION
  neo: { scope: back }
  css:
    component:
      src/css/page-url.css: {}
