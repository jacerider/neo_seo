neo_seo.settings:
  type: neo_seo
  mapping:
    _core:
      # This only exists for merging configuration; it's not required.
      requiredKey: false
      type: _core_config_info

neo_settings.settings.neo_seo:
  type: neo_seo

neo_seo:
  type: mapping
  label: 'Neo SEO settings'
  mapping:
    identity:
      type: mapping
      label: 'Site identity'
      mapping:
        type:
          type: string
          label: 'What the site represents: organization or person'
        organization_type:
          type: string
          label: 'schema.org Organization type'
        name:
          type: string
          label: 'Name (tokens allowed)'
        description:
          type: string
          label: 'Description (tokens allowed)'
        logo_source:
          type: string
          label: 'Where the logo comes from: media or favicon'
        logo:
          type: string
          label: 'Logo or image media UUID'
        same_as_site_settings:
          type: boolean
          label: 'Use the social links from site settings'
        same_as_type:
          type: string
          label: 'The site settings type holding the social links'
        same_as:
          type: sequence
          label: 'Social profile URLs (tokens allowed), beside those from site settings'
          sequence:
            type: string
        telephone:
          type: string
          label: 'Telephone (tokens allowed)'
        email:
          type: string
          label: 'Email (tokens allowed)'
        address:
          type: mapping
          label: 'Postal address (tokens allowed)'
          mapping:
            street:
              type: string
            locality:
              type: string
            region:
              type: string
            postal_code:
              type: string
            country:
              type: string
    verification:
      type: mapping
      label: 'Site verification codes'
      mapping:
        google:
          type: string
          label: 'Google'
        bing:
          type: string
          label: 'Bing'
        yandex:
          type: string
          label: 'Yandex'
        pinterest:
          type: string
          label: 'Pinterest'
        facebook:
          type: string
          label: 'Facebook'
    head_alongside_metatag:
      type: boolean
      label: 'Print head tags even while metatag is enabled'
    share_image_style:
      type: string
      label: 'Image style share images are served through'
    override_entity_types:
      type: sequence
      label: 'Entity types that get the SEO overrides field'
      sequence:
        type: string

neo_seo.defaults.*:
  type: config_entity
  label: 'SEO default templates'
  mapping:
    id:
      type: machine_name
      label: 'ID'
      constraints:
        Regex:
          pattern: '/^[a-z0-9_]+$/'
          message: "The %value machine name is not valid."
    label:
      type: required_label
      label: 'Label'
    values:
      type: sequence
      label: 'Templates, keyed by field'
      sequence:
        type: string
        label: 'Template (tokens allowed)'

neo_seo.bundle_mapping:
  type: mapping
  label: 'SEO bundle mapping'
  mapping:
    page_type:
      type: string
      label: 'Page type'
    page_types:
      type: sequence
      label: 'Page types editors may choose'
      sequence:
        type: string
    article_type:
      type: string
      label: 'Article type'
    article_types:
      type: sequence
      label: 'Article types editors may choose'
      sequence:
        type: string
    image_field:
      type: string
      label: 'Primary image field'
    published_field:
      type: string
      label: 'Date published field'
    modified_field:
      type: string
      label: 'Date modified field'
    author_field:
      type: string
      label: 'Authors field'
    job_title_field:
      type: string
      label: 'Job title field (person bundles)'
    same_as_field:
      type: string
      label: 'Social profiles field (person bundles)'

node.type.*.third_party.neo_seo:
  type: neo_seo.bundle_mapping

taxonomy.vocabulary.*.third_party.neo_seo:
  type: neo_seo.bundle_mapping

media.type.*.third_party.neo_seo:
  type: neo_seo.bundle_mapping

views.display_extender.neo_seo:
  type: views_display_extender
  label: 'SEO display extender'
  mapping:
    seo:
      type: mapping
      label: 'SEO'
      mapping:
        title:
          type: string
          label: 'Title template'
        description:
          type: string
          label: 'Description template'
        image:
          type: string
          label: 'Share image template'
        page_type:
          type: string
          label: 'Page type'
