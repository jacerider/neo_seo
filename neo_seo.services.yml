parameters:
  # How many entities one schemamap feed page holds.
  neo_seo.schemamap.per_page: 100
  # Every hook lives on a class under src/Hook.
  neo_seo.skip_procedural_hook_scan: true

services:
  plugin.manager.neo_seo_graph_piece:
    class: Drupal\neo_seo\Graph\GraphPiecePluginManager
    parent: default_plugin_manager
  Drupal\neo_seo\Graph\GraphPiecePluginManager: '@plugin.manager.neo_seo_graph_piece'

  neo_seo.schema_ids:
    class: Drupal\neo_seo\Graph\SchemaIds
  Drupal\neo_seo\Graph\SchemaIds: '@neo_seo.schema_ids'

  neo_seo.graph_builder:
    class: Drupal\neo_seo\Graph\GraphBuilder
    autowire: true
  Drupal\neo_seo\Graph\GraphBuilder: '@neo_seo.graph_builder'

  neo_seo.page_context_factory:
    class: Drupal\neo_seo\Graph\PageContextFactory
    arguments:
      - '@current_route_match'
      - '@request_stack'
      - '@path.matcher'
      - '@language_manager'
      - '@config.factory'
      - '@title_resolver'
      - '@renderer'
  Drupal\neo_seo\Graph\PageContextFactory: '@neo_seo.page_context_factory'

  neo_seo.settings:
    class: Drupal\neo_settings\SettingsRepository
    parent: neo_settings.repository
    arguments: ['neo_seo']

  neo_seo.site_identity:
    class: Drupal\neo_seo\SiteIdentity\SiteIdentityResolver
    arguments:
      - '@neo_seo.settings'
      - '@token'
      - '@neo_seo.media_image'
      - '@neo_seo.identity_sources'
  Drupal\neo_seo\SiteIdentity\SiteIdentityResolver: '@neo_seo.site_identity'

  # Site settings and the favicon as identity sources; both modules optional.
  neo_seo.identity_sources:
    class: Drupal\neo_seo\SiteIdentity\IdentitySources
    arguments:
      - '@module_handler'
      - '@entity_type.manager'
      - '@entity_display.repository'
      - '@entity_field.manager'
      - '@file_url_generator'
      - '@config.factory'
      - '@?neo_favicon.manager'
  Drupal\neo_seo\SiteIdentity\IdentitySources: '@neo_seo.identity_sources'

  neo_seo.media_image:
    class: Drupal\neo_seo\MediaImage
    arguments:
      - '@entity_type.manager'
      - '@entity.repository'
      - '@file_url_generator'
      - '@config.factory'
  Drupal\neo_seo\MediaImage: '@neo_seo.media_image'

  plugin.manager.neo_seo_head_tag:
    class: Drupal\neo_seo\Head\HeadTagPluginManager
    parent: default_plugin_manager
  Drupal\neo_seo\Head\HeadTagPluginManager: '@plugin.manager.neo_seo_head_tag'

  neo_seo.head_values:
    class: Drupal\neo_seo\Head\HeadValuesResolver
    autowire: true
  Drupal\neo_seo\Head\HeadValuesResolver: '@neo_seo.head_values'

  neo_seo.head_gate:
    class: Drupal\neo_seo\Head\HeadGate
    arguments:
      - '@router.admin_context'
      - '@current_route_match'
      - '@module_handler'
      - '@neo_seo.settings'
      - '@neo_seo.diff_mode'
  Drupal\neo_seo\Head\HeadGate: '@neo_seo.head_gate'

  logger.channel.neo_seo:
    parent: logger.channel_base
    arguments: ['neo_seo']

  neo_seo.overrides_storage:
    class: Drupal\neo_seo\SeoOverridesStorage
    arguments:
      - '@entity_type.manager'
      - '@entity_field.manager'
      - '@entity.definition_update_manager'
      - '@logger.channel.neo_seo'
  Drupal\neo_seo\SeoOverridesStorage: '@neo_seo.overrides_storage'

  neo_seo.settings_subscriber:
    class: Drupal\neo_seo\EventSubscriber\SettingsSubscriber
    arguments: ['@neo_seo.overrides_storage']
    tags:
      - { name: event_subscriber }

  neo_seo.bundle_mapping:
    class: Drupal\neo_seo\Mapping\BundleMappingRepository
    arguments: ['@entity_type.manager', '@neo_seo.media_image']
  Drupal\neo_seo\Mapping\BundleMappingRepository: '@neo_seo.bundle_mapping'

  neo_seo.breadcrumb_trail:
    class: Drupal\neo_seo\Graph\BreadcrumbTrail
    arguments: ['@breadcrumb', '@current_route_match']
  Drupal\neo_seo\Graph\BreadcrumbTrail: '@neo_seo.breadcrumb_trail'

  neo_seo.people:
    class: Drupal\neo_seo\Graph\People
    arguments: ['@neo_seo.bundle_mapping', '@neo_seo.schema_ids', '@neo_seo.media_image', '@entity.repository']
  Drupal\neo_seo\Graph\People: '@neo_seo.people'

  neo_seo.validation_sampler:
    class: Drupal\neo_seo\Validation\ValidationSampler
    arguments: ['@entity_type.manager', '@entity_type.bundle.info', '@config.factory', '@module_handler']
  Drupal\neo_seo\Validation\ValidationSampler: '@neo_seo.validation_sampler'

  neo_seo.structured_data_validator:
    class: Drupal\neo_seo\Validation\StructuredDataValidator
    arguments: ['@http_client', '@file_system', '@extension.list.module']
  Drupal\neo_seo\Validation\StructuredDataValidator: '@neo_seo.structured_data_validator'

  neo_seo.views_seo:
    class: Drupal\neo_seo\ViewsSeo
    arguments: ['@entity_type.manager', '@module_handler']
  Drupal\neo_seo\ViewsSeo: '@neo_seo.views_seo'

  # The site's schema as feeds, listed by /schemamap.xml (Yoast's schema
  # aggregation format): every page's graph, built as an anonymous visitor.
  neo_seo.schemamap:
    class: Drupal\neo_seo\Schemamap\SchemamapBuilder
    arguments:
      - '@entity_type.manager'
      - '@entity_type.bundle.info'
      - '@config.factory'
      - '@neo_seo.page_context_factory'
      - '@neo_seo.graph_builder'
      - '@neo_seo.head_values'
      - '@cache.default'
      - '@account_switcher'
      - '@renderer'
      - '%neo_seo.schemamap.per_page%'
  Drupal\neo_seo\Schemamap\SchemamapBuilder: '@neo_seo.schemamap'

  neo_seo.component_pieces:
    class: Drupal\neo_seo\Alchemist\ComponentPieceCollector
    arguments: ['@module_handler', '@logger.channel.neo_seo', '@neo_seo.component_schema', '@neo_seo.schema_ids']
  Drupal\neo_seo\Alchemist\ComponentPieceCollector: '@neo_seo.component_pieces'

  # The `seo` declaration of a component's .component.yml: its filters, the
  # evaluator building its nodes, and the static checks behind the lint.
  neo_seo.component_schema_filters:
    class: Drupal\neo_seo\ComponentSchema\Filters
    arguments: ['@file_url_generator', '@stream_wrapper_manager', '@transliteration']
  Drupal\neo_seo\ComponentSchema\Filters: '@neo_seo.component_schema_filters'
  neo_seo.component_schema:
    class: Drupal\neo_seo\ComponentSchema\Evaluator
    arguments: ['@neo_seo.component_schema_filters', '@neo_seo.schema_ids']
  Drupal\neo_seo\ComponentSchema\Evaluator: '@neo_seo.component_schema'
  neo_seo.component_schema_linter:
    class: Drupal\neo_seo\ComponentSchema\DeclarationLinter
  Drupal\neo_seo\ComponentSchema\DeclarationLinter: '@neo_seo.component_schema_linter'

  neo_seo.diff_mode:
    class: Drupal\neo_seo\Migration\DiffMode
    arguments: ['@state', '@request_stack', '@datetime.time']
  Drupal\neo_seo\Migration\DiffMode: '@neo_seo.diff_mode'

  neo_seo.metatag_migrator:
    class: Drupal\neo_seo\Migration\MetatagMigrator
    arguments: ['@entity_type.manager', '@entity_field.manager', '@config.factory', '@neo_seo.bundle_mapping', '@neo_seo.identity_sources']
  Drupal\neo_seo\Migration\MetatagMigrator: '@neo_seo.metatag_migrator'

  neo_seo.head_diff:
    class: Drupal\neo_seo\Migration\HeadDiff
    arguments: ['@neo_seo.structured_data_validator', '@neo_seo.diff_mode']
  Drupal\neo_seo\Migration\HeadDiff: '@neo_seo.head_diff'

  neo_seo.draft_renderer:
    class: Drupal\neo_seo\Draft\DraftRenderer
    arguments:
      - '@entity_type.manager'
      - '@renderer'
      - '@theme.manager'
      - '@theme.initialization'
      - '@config.factory'
      - '@neo_seo.page_context_factory'
      - '@neo_seo.head_values'
      - '@neo_seo.breadcrumb_trail'
      - '@module_handler'
      - '@?neo_alchemist.shared_draft_store'
  Drupal\neo_seo\Draft\DraftRenderer: '@neo_seo.draft_renderer'
